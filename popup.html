<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IRCTC Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="header-content">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <div class="title-group">
            <h1>IRCTC Assistant</h1>
            <p>Smart Tatkal Booking Automation</p>
          </div>
        </div>
        <div class="status-badge">
          <span class="dot"></span> Connected
        </div>
      </div>
    </header>

    <div class="card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Account Information
      </div>
      <div class="card-body">
        <div class="form-group">
          <label for="username">IRCTC Username</label>
          <input type="text" id="username" placeholder="Enter Username">
        </div>
        <div class="form-group">
          <label for="password">IRCTC Password</label>
          <input type="password" id="password" placeholder="Enter Password">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Journey Details
      </div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group half">
            <label for="fromStation">From</label>
            <input type="text" id="fromStation" placeholder="e.g. BDNK">
          </div>
          <div class="form-group half">
            <label for="toStation">To</label>
            <input type="text" id="toStation" placeholder="e.g. MS">
          </div>
        </div>
        <div class="form-group">
          <label for="journeyDate">Journey Date (DD/MM/YYYY)</label>
          <input type="text" id="journeyDate" placeholder="15/08/2026">
        </div>
        <div class="form-row">
          <div class="form-group half">
            <label for="travelClass">Class</label>
            <select id="travelClass">
              <option value="All Classes">All Classes</option>
              <option value="1A">First AC</option>
              <option value="2A">Second AC</option>
              <option value="3A">Third AC</option>
              <option value="SL">Sleeper</option>
              <option value="CC">AC Chair Car</option>
              <option value="2S">Second Sitting</option>
            </select>
          </div>
          <div class="form-group half">
            <label for="quota">Quota</label>
            <select id="quota">
              <option value="GN">General</option>
              <option value="TQ">Tatkal</option>
              <option value="PT">Premium Tatkal</option>
              <option value="LD">Ladies</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Passenger Details
      </div>
      <div class="card-body">
        <div class="form-group">
          <label for="passengerNames">Master List Passengers (comma-separated)</label>
          <input type="text" id="passengerNames" placeholder="e.g. Madhu Sanjay, Murugesan P">
          <small class="help-text">Names must match exactly with your IRCTC Master List</small>
        </div>
        <div class="form-group">
          <label for="paymentMode">Payment Mode</label>
          <select id="paymentMode">
            <option value="CARD">Credit & Debit Cards / Wallets</option>
            <option value="UPI">BHIM / UPI</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Advanced Booking
      </div>
      <div class="card-body">
        <div class="toggle-group form-group">
          <div class="toggle-text">
            <label for="fasterMode">Aggressive Speed Mode</label>
            <div class="help-text">Reduces bot-safety delays. Login takes ~2.5s instead of ~8s.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="fasterMode">
            <span class="slider round"></span>
          </label>
        </div>
        
        <div class="form-row">
          <div class="form-group half">
            <label for="targetTrain">Target Train No.</label>
            <input type="text" id="targetTrain" placeholder="e.g. 06603">
          </div>
          <div class="form-group half">
            <label for="targetClass">Target Class</label>
            <select id="targetClass">
              <option value="">Select</option>
              <option value="1A">1A</option>
              <option value="2A">2A</option>
              <option value="3A">3A</option>
              <option value="SL">SL</option>
              <option value="CC">CC</option>
              <option value="2S">2S</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn primary">Save Preferences</button>
      <button id="openIrctcBtn" class="btn secondary">Open IRCTC</button>
    </div>
    
    <div id="statusMessage" class="status hidden"></div>

    <footer class="app-footer">
      <p>IRCTC Assistant</p>
      <p>Version 2.x • Ready for Booking</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
